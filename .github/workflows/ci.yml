name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify zero runtime dependencies
        run: |
          node -e "
            const pkg = JSON.parse(require('node:fs').readFileSync('package.json', 'utf8'));
            const deps = Object.keys(pkg.dependencies || {});
            if (deps.length > 0) {
              console.error('Unexpected runtime dependencies:', deps);
              process.exit(1);
            }
          "

      - name: Run static checks
        run: npm run check

      - name: Validate example configuration
        run: node bin/ops-console.mjs --check-config --config ops-console.config.example.json

      - name: Run test suite
        run: npm test

  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ops-console:ci-test

      - name: Smoke test container CLI
        run: |
          docker run --rm ops-console:ci-test node bin/ops-console.mjs --version
          docker run --rm ops-console:ci-test node bin/ops-console.mjs --check-config --config ops-console.config.example.json
