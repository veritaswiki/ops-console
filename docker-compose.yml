services:
  ops-console:
    build:
      context: .
      dockerfile: Dockerfile
    image: ops-console:0.4.0
    container_name: ops-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:4320:4320"
    environment:
      OPS_CONSOLE_CONFIG: /etc/ops-console/config.json
      OPS_CONSOLE_HOSTS: "0.0.0.0"
      OPS_CONSOLE_PORT: "4320"
      OPS_CONSOLE_DATA_DIR: /app/data
      OPS_CONSOLE_WEB_KEY: ${OPS_CONSOLE_WEB_KEY:-}
      OPS_CONSOLE_READ_ONLY: ${OPS_CONSOLE_READ_ONLY:-0}
      OPS_CONSOLE_DEMO: ${OPS_CONSOLE_DEMO:-0}
      MIHOMO_API_SECRET: ${MIHOMO_API_SECRET:-}
      SYNCTHING_API_KEY: ${SYNCTHING_API_KEY:-}
    volumes:
      # Mount your local config by exporting OPS_CONSOLE_CONFIG_FILE=./config.local.json
      - ${OPS_CONSOLE_CONFIG_FILE:-./ops-console.config.example.json}:/etc/ops-console/config.json:ro
      - ops-console-data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4320/api/ping').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ops-console-data:
